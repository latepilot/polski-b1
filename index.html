<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Polski B1 · Duolingo-style Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ======================== RESET & BASE ======================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #fafaf9;
  --card: #ffffff;
  --primary: #5645d4;
  --primary-dark: #4534b3;
  --primary-deep: #3a2a99;
  --accent: #5645d4;
  --accent-dark: #4534b3;
  --gold: #d4a017;
  --red: #e03131;
  --text: #37352f;
  --text-dark: #1a1a1a;
  --text-light: #787671;
  --text-muted: #bbb8b1;
  --border: #e5e3df;
  --border-strong: #c8c4be;
  --border-soft: #ede9e4;
  --success: #1aae39;
  --error: #e03131;
  --xp-color: #d4a017;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --shadow: 0 1px 3px rgba(15,15,15,0.08);
  --shadow-lg: 0 4px 16px rgba(15,15,15,0.10);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --progress-dot-bg: var(--border);
  --skill-card-bg: var(--card);
  --option-bg: #ffffff;
  --polish-bg: #f6f5f4;
  --polish-border: var(--primary);
  --sample-bg: #f6f5f4;
  --sample-border: var(--border-strong);
  --highlight-bg: #fef7d6;
  --highlight-border: var(--gold);
  --example-bg: #f6f5f4;
  --th-bg: #f6f5f4;
  --toggle-icon: '☾';
  --correct-bg: #d9f3e1;
  --wrong-bg: #fde0ec;
  --selected-bg: #e6e0f5;
  --hover-bg: #f0eeec;
  --card-alt: #f6f5f4;
  --tak-bg: #d9f3e1;
  --nie-bg: #fde0ec;
  --writing-bg: #ffffff;
  --modal-overlay: rgba(15,15,15,0.4);
  --accent-ring: rgba(86,69,212,0.2);
}

[data-theme="dark"] {
  --bg: #1a1a1a;
  --card: #2a2a2a;
  --primary: #7b6ff0;
  --primary-dark: #5645d4;
  --primary-deep: #4534b3;
  --accent: #7b6ff0;
  --accent-dark: #5645d4;
  --gold: #e8b84a;
  --red: #f05a5a;
  --text: #d1d1d1;
  --text-dark: #e8e8e8;
  --text-light: #999999;
  --text-muted: #777777;
  --border: #3a3a3a;
  --border-strong: #4a4a4a;
  --border-soft: #333333;
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.4);
  --progress-dot-bg: #3a3a3a;
  --skill-card-bg: #2a2a2a;
  --option-bg: #2a2a2a;
  --polish-bg: #2a2a2a;
  --sample-bg: #2a2a2a;
  --sample-border: #4a4a4a;
  --highlight-bg: #3a3a0a;
  --example-bg: #2a2a2a;
  --th-bg: #333333;
  --correct-bg: #1a3a1a;
  --wrong-bg: #3a1a1a;
  --selected-bg: #2a2a4a;
  --hover-bg: #333333;
  --card-alt: #5a4a8a;
  --tak-bg: #1a3a1a;
  --nie-bg: #3a1a1a;
  --writing-bg: #2a2a2a;
  --toggle-icon: '☀';
  --modal-overlay: rgba(0,0,0,0.6);
  --accent-ring: rgba(123,111,240,0.25);
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input, textarea { font-family: inherit; }

/* ======================== LAYOUT ======================== */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  background: var(--bg);
}

/* ======================== TOP BAR ======================== */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 8px;
}
.top-bar .brand {
  font-weight: 700;
  font-size: 17px;
  color: var(--text-dark);
  display: flex;
  align-items: center;
  gap: 4px;
}
.top-bar .brand span { color: var(--primary); }
.top-bar .stats {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
}
.stat-item {
  display: flex;
  align-items: center;
  gap: 2px;
}
.stat-item .icon { font-size: 16px; }
.stat-item.xp { color: var(--xp-color); }
.stat-item.streak { color: var(--gold); }

/* ======================== PROGRESS ======================== */
.progress-strip {
  display: flex;
  gap: 4px;
  padding: 8px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--border-soft);
  flex-shrink: 0;
  overflow-x: auto;
}
.progress-dot {
  width: 28px; height: 28px; border-radius: 6px;
  background: var(--progress-dot-bg);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  transition: 0.2s;
  cursor: pointer;
}
.progress-dot.done { background: var(--primary); color: #fff; }
.progress-dot.wrong { background: var(--error); color: #fff; }
.progress-dot.active { 
  background: var(--primary); color: #fff;
  box-shadow: 0 0 0 3px var(--accent-ring);
}

/* ======================== CONTENT AREA ======================== */
.content-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  -webkit-overflow-scrolling: touch;
}

/* ======================== UNITS / SKILL TREE ======================== */
.unit-tree { padding-bottom: 20px; }
.unit-tree h2 { font-size: 17px; font-weight: 600; color: var(--text-dark); margin-bottom: 16px; }
.unit-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 24px;
}
.unit-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-muted);
  letter-spacing: 0.8px;
  margin-bottom: 2px;
}
.skill-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--skill-card-bg);
  border-radius: var(--radius-xs);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: 0.15s;
  border-left: 4px solid var(--border);
}
.skill-card:hover { background: var(--hover-bg); transform: translateX(2px); }
.skill-card.completed { border-left-color: var(--primary); opacity: 0.7; }
.skill-card.locked { border-left-color: var(--border); opacity: 0.5; cursor: default; }
.skill-card.available { border-left-color: var(--primary); }
.skill-card .skill-icon { font-size: 26px; flex-shrink: 0; color: var(--primary); display: flex; align-items: center; }
.icon-svg { width: 1em; height: 1em; fill: currentColor; display: inline-block; vertical-align: middle; pointer-events: none; flex-shrink: 0; }
.skill-card .skill-info { flex: 1; min-width: 0; }
.skill-card .skill-name { font-weight: 600; font-size: 14px; color: var(--text-dark); }
.skill-card .skill-desc { font-size: 12px; color: var(--text-light); }
.skill-card .skill-status { font-size: 12px; font-weight: 600; }
.skill-card .skill-status.done { color: var(--primary); }
.skill-card .skill-status.locked-txt { color: var(--text-muted); }
.skill-card .skill-status.active-txt { color: var(--gold); }
.skill-bar {
  height: 4px; border-radius: 2px; background: var(--border); margin-top: 4px;
  overflow: hidden;
}
.skill-bar-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: 0.3s; }

/* ======================== EXERCISE CARDS ======================== */
.exercise-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  animation: fadeIn 0.2s ease;
  border: 1px solid var(--border-soft);
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.exercise-card .hint {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 12px;
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: 0.8px;
}
.exercise-card .question {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-dark);
  line-height: 1.5;
  margin-bottom: 16px;
}
.exercise-card .polish-text {
  font-size: 15px;
  color: var(--text-dark);
  line-height: 1.6;
  padding: 14px;
  background: var(--polish-bg);
  border-radius: var(--radius-xs);
  margin-bottom: 16px;
  border-left: 3px solid var(--polish-border);
}
.options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.option-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  background: var(--option-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-dark);
  text-align: left;
  transition: 0.15s;
  width: 100%;
}
.option-btn:hover { background: var(--hover-bg); }
.option-btn.selected { border-color: var(--primary); background: var(--selected-bg); }
.option-btn.correct { border-color: var(--success); background: var(--correct-bg); }
.option-btn.wrong { border-color: var(--error); background: var(--wrong-bg); }
.option-btn .letter {
  width: 26px; height: 26px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 12px;
  background: var(--border); color: var(--text-muted); flex-shrink: 0;
}
.option-btn.selected .letter { background: var(--primary); color: #fff; }
.option-btn.correct .letter { background: var(--success); color: #fff; }
.option-btn.wrong .letter { background: var(--error); color: #fff; }

/* fill-in */
.fill-input {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
}
.fill-input input {
  padding: 10px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xs);
  font-size: 15px;
  font-weight: 500;
  width: 180px;
  transition: 0.2s;
  color: var(--text-dark);
  background: var(--card);
}
.fill-input input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
.fill-input input.correct { border-color: var(--success); background: var(--correct-bg); }
.fill-input input.wrong { border-color: var(--error); background: var(--wrong-bg); }

/* matching */
.match-pair {
  display: flex;
  gap: 8px; margin-bottom: 8px;
  align-items: center;
}
.match-left, .match-right {
  flex: 1;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  cursor: pointer;
  transition: 0.15s;
  background: var(--option-bg);
}
.match-left:hover, .match-right:hover { background: var(--hover-bg); }
.match-left.selected, .match-right.selected { border-color: var(--primary); background: var(--selected-bg); }
.match-left.matched, .match-right.matched { 
  border-color: var(--success); background: var(--correct-bg);
  cursor: default; opacity: 0.8;
}
.match-left.wrong, .match-right.wrong { 
  border-color: var(--error); background: var(--wrong-bg);
}

/* TAK/NIE */
.tak-nie { display: flex; gap: 8px; margin-bottom: 16px; justify-content: center; }
.tak-nie button {
  padding: 12px 32px;
  font-size: 15px;
  font-weight: 600;
  border-radius: var(--radius-xs);
  transition: 0.15s;
}
.tak-nie button.tak-btn { background: var(--tak-bg); color: var(--success); border: 2px solid var(--success); }
.tak-nie button.nie-btn { background: var(--nie-bg); color: var(--error); border: 2px solid var(--error); }
.tak-nie button.selected { opacity: 0.6; }
.tak-nie button.correct { opacity: 1; box-shadow: 0 0 0 3px rgba(26,174,57,0.25); }
.tak-nie button.wrong { opacity: 1; box-shadow: 0 0 0 3px rgba(224,49,49,0.25); }

/* writing */
.writing-area {
  width: 100%;
  min-height: 120px;
  padding: 12px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xs);
  font-size: 15px;
  line-height: 1.55;
  resize: vertical;
  margin-bottom: 12px;
  background: var(--writing-bg);
  color: var(--text-dark);
}
.writing-area:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
.sample-answer {
  background: var(--sample-bg);
  border: 1px solid var(--sample-border);
  border-radius: var(--radius-xs);
  padding: 14px;
  font-size: 14px;
  line-height: 1.6;
  margin-top: 8px;
}
.sample-answer strong { color: var(--primary); }

/* ======================== FEEDBACK ======================== */
.feedback {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border-soft);
  animation: popIn 0.25s ease;
}
@keyframes popIn { 
  0% { transform: scale(0.92); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.feedback .icon { font-size: 44px; margin-bottom: 8px; }
.feedback .msg { font-size: 17px; font-weight: 600; margin-bottom: 4px; color: var(--text-dark); }
.feedback .sub { font-size: 13px; color: var(--text-light); }
.feedback .xp-gain { color: var(--xp-color); font-weight: 600; font-size: 15px; margin-top: 8px; }

/* ======================== BOTTOM BUTTON ======================== */
.bottom-btn-wrap {
  padding: 12px 16px 20px;
  flex-shrink: 0;
  background: var(--card);
  border-top: 1px solid var(--border-soft);
}
.check-btn {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  border-radius: var(--radius-xs);
  transition: 0.15s;
  letter-spacing: 0.2px;
}
.check-btn:hover { background: var(--primary-dark); }
.check-btn:disabled { background: var(--border); color: var(--text-muted); cursor: default; transform: none; }
.check-btn.secondary { background: var(--card); color: var(--primary); border: 1px solid var(--border-strong); }
.check-btn.secondary:hover { background: var(--hover-bg); }
.check-btn.danger { background: var(--error); }
.check-btn.danger:hover { background: #c92a2a; }

/* ======================== LEVEL UP MODAL ======================== */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--modal-overlay);
  display: flex; align-items: center; justify-content: center;
  z-index: 999;
  animation: fadeIn 0.2s;
}
.modal-box {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 24px;
  text-align: center;
  max-width: 340px;
  width: 90%;
  box-shadow: var(--shadow-lg);
  animation: popIn 0.25s;
  border: 1px solid var(--border-soft);
}
.modal-box .big-icon { font-size: 56px; margin-bottom: 8px; }
.modal-box h2 { font-size: 20px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
.modal-box p { font-size: 14px; color: var(--text-light); margin-bottom: 16px; }
.modal-box button {
  padding: 12px 32px;
  background: var(--primary);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  border-radius: var(--radius-xs);
}

/* ======================== LEARN SECTION ======================== */
.learn-content { line-height: 1.7; }
.learn-content h3 { font-size: 17px; font-weight: 600; color: var(--text-dark); margin: 16px 0 8px; }
.learn-content h3:first-child { margin-top: 0; }
.learn-content p { margin-bottom: 8px; }
.learn-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 14px;
}
.learn-content td, .learn-content th {
  border: 1px solid var(--border);
  padding: 8px 10px;
  text-align: center;
}
.learn-content th {
  background: var(--th-bg);
  font-weight: 600;
  color: var(--text-dark);
}
.learn-content .example {
  background: var(--example-bg);
  padding: 10px 14px;
  border-radius: var(--radius-xs);
  font-style: italic;
  margin: 8px 0;
}
.learn-content .highlight {
  background: var(--highlight-bg);
  padding: 10px 14px;
  border-radius: var(--radius-xs);
  border-left: 3px solid var(--highlight-border);
  margin: 8px 0;
  font-size: 14px;
}

/* ======================== SCROLLBAR ======================== */
.content-wrap::-webkit-scrollbar { width: 4px; }
.content-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ======================== RESPONSIVE ======================== */
@media (max-width: 400px) {
  .top-bar .brand { font-size: 15px; }
  .stat-item { font-size: 12px; }
  .skill-card { padding: 12px; }
  .exercise-card { padding: 16px; }
  .exercise-card .question { font-size: 15px; }
}
</style>
</head>

function renderLesson(lessonId) {
  switch(lessonId) {
    case 'grammar-nouns':
      return `<div class="learn-content exercise-card">
        <div class="hint">🔒  Rzeczownik — Rodzaj i liczba</div>
        <h3>Rodzaj rzeczownika (Rodzaj)</h3>
        <p>W języku polskim są trzy rodzaje w liczbie pojedynczej:</p>
        <table>
          <tr><th>Rodzaj</th><th>Zaimek</th><th>Końcówka</th><th>Przykład</th></tr>
          <tr><td>męski (męski)</td><td>ten</td><td>spółgłoska</td><td>syn, pies, brat, dom</td></tr>
          <tr><td>żeński (żeński)</td><td>ta</td><td>-a</td><td>mama, ulica, córka, kawa</td></tr>
          <tr><td>nijaki (nijaki)</td><td>to</td><td>-o, -e, -ę</td><td>kino, mieszkanie, imię</td></tr>
        </table>
        <div class="highlight">⚑ Uwaga! Niektóre rzeczowniki męskie kończą się na -a (mężczyzna, kolega, dentysta).</div>
        <h3>Liczba mnoga (Liczba mnoga)</h3>
        <p>W liczbie mnogiej wyróżniamy:</p>
        <table>
          <tr><th>Rodzaj</th><th>Zaimek</th><th>Przykład</th></tr>
          <tr><td>męskoosobowy (męskoosobowy)</td><td>ci</td><td>ci mężczyźni, ci studenci</td></tr>
          <tr><td>niemęskoosobowy (niemęskoosobowy)</td><td>te</td><td>te kobiety, te domy, te dzieci</td></tr>
        </table>
        <div class="example">Przykłady:
- student → studenci (męskoosobowy)
- kobieta → kobiety (niemęskoosobowy)
- dziecko → dzieci (niemęskoosobowy)
- dom → domy (niemęskoosobowy)
        </div>
      </div>`;
    case 'grammar-cases-nom':
      return `<div class="learn-content exercise-card">
        <div class="hint">🔒  Mianownik (Nominative)</div>
        <p>Mianownik odpowiada na pytania <strong>kto? co?</strong> — to podstawowa forma rzeczownika.</p>
        <h3>Końcówki liczby mnogiej</h3>
        <table>
          <tr><th>Rodzaj w lp.</th><th>Końcówka lm.</th><th>Przykład</th></tr>
          <tr><td>męski na -k, -g</td><td>-i</td><td>żarówka → żarówki, kosmetyk → kosmetyki</td></tr>
          <tr><td>męski na -ń, -sz, -cz, -rz, -ż, -l, -j, -c, -dz, -ś, -ć, -ź</td><td>-e</td><td>grosz → grosze, pokój → pokoje</td></tr>
          <tr><td>męskoosobowy</td><td>-owie, -y, -i, -e</td><td>pan → panowie, Polak → Polacy</td></tr>
          <tr><td>żeński / nijaki (standard)</td><td>-y, -i, -a</td><td>dziura → dziury, ubranie → ubrania</td></tr>
        </table>
        <div class="highlight">⚠️ Wyjątki: brat → bracia, ksiądz → księża, rok → lata, człowiek → ludzie</div>
        <p>Rzeczowniki męskoosobowe mają specjalne formy:</p>
        <div class="example">
nauczyciel → nauczyciele<br>
lekarz → lekarze<br>
student → studenci<br>
artysta → artyści<br>
chłopiec → chłopcy
        </div>
      </div>`;
    case 'grammar-gen':
      return `<div class="learn-content exercise-card">
        <div class="hint">🔒  Dopełniacz (Genitive) — Kogo? Czego?</div>
        <p>Dopełniacz używa się po: <strong>bez, dla, do, od, z, naprzeciwko, obok</strong>
        i z przeczeniem: <em>Nie mam... Nie widzę...</em></p>
        <table>
          <tr><th>Rodzaj</th><th>Końcówka lp.</th><th>Przykład</th></tr>
          <tr><td>męski</td><td>-a / -u</td><td>syna, sportu</td></tr>
          <tr><td>żeński</td><td>-y / -i</td><td>mamy, ulicy</td></tr>
          <tr><td>nijaki</td><td>-a</td><td>nazwiska, mieszkania</td></tr>
        </table>
        <div class="highlight">Końcówka -u dla męskich: krótkie słowa (sok → soku), zapożyczenia (bar → baru), 
        dni tygodnia (wtorek → wtorku), niepoliczalne (cukier → cukru), środki transportu (autobus → autobusu).</div>
        <p>Czasowniki z dopełniaczem: <strong>bać się, szukać, słuchać, uczyć się, życzyć</strong></p>
        <div class="example">
- Uczę się języka polskiego.<br>
- Szukam książki.<br>
- Nie mam czasu.<br>
- Słucham muzyki.
        </div>
      </div>`;
    case 'grammar-dat':
      return `<div class="learn-content exercise-card">
        <div class="hint">🔒  Celownik (Dative) — Komu? Czemu?</div>
        <p>Celownik po: <strong>dzięki, ku, przeciw</strong>. Z czasownikami: <strong>dać, dziękować, pomagać, powiedzieć, obiecać</strong>.</p>
        <table>
          <tr><th>Rodzaj</th><th>Końcówka</th><th>Przykład</th></tr>
          <tr><td>męski</td><td>-owi / -u</td><td>mężowi, bratu, psu</td></tr>
          <tr><td>żeński</td><td>-i/-y / -e/-ie</td><td>babei, ulicy, koleżance</td></tr>
          <tr><td>nijaki</td><td>-u</td><td>dziecku</td></tr>
        </table>
        <div class="highlight">Wymiany głosek: ch→sz (mucha → musze), d→dz (woda → wodzie), 
        g→dz (kolega → koledze), k→c (matka → matce), r→rz (siostra → siostrze)</div>
      </div>`;
    case 'grammar-acc':
      return `<div class="learn-content exercise-card">
        <div class="hint">🔒  Biernik (Accusative) — Kogo? Co?</div>
        <p>Biernik po: <strong>na, pod, przez, nad, w</strong>. Z czasownikami: <strong>mieć, lubić, jeść, kupować, czytać, znać, oglądać, prosić</strong>.</p>
        <table>
          <tr><th>Rodzaj</th><th>Końcówka lp.</th><th>Przykład</th></tr>
          <tr><td>męski osobowy</td><td>-a (jak dopełniacz)</td><td>mam psa, widzę studenta</td></tr>
          <tr><td>męski nieosobowy</td><td>— (jak mianownik)</td><td>mam dom, lubię sport</td></tr>
          <tr><td>żeński</td><td>-ę</td><td>mam mamę, lubię kawę</td></tr>
          <tr><td>nijaki</td><td>— (jak mianownik)</td><td>mam mieszkanie, lubię kino</td></tr>
        </table>

// ========================================================================
// WORD BANK — nouns with all 7 cases for dynamic exercise generation
// ========================================================================
function generateExercise(skillId) {
  const templateGroup = CASE_TEMPLATES[skillId];
  if (!templateGroup) return null;

  // Find which case this template uses (extract from first template)
  const caseMatch = templateGroup.templates[0].sentence.match(/\{\{word\.(\w+)\}\}/);
  const caseName = caseMatch ? caseMatch[1] : 'nom';
  
  const questions = [];
  const available = [...templateGroup.templates];
  const usedWords = new Set();
  const targetCount = Math.min(available.length, 5);
  
  for (let i = 0; i < targetCount; i++) {
    const tpl = available.splice(Math.floor(Math.random() * available.length), 1)[0];
    if (!tpl) break;
    
    // Pick a word NOT already used in this session
    let wordKey;
    const shuffledWords = [...tpl.words].sort(() => Math.random() - 0.5);
    for (const w of shuffledWords) {
      if (!usedWords.has(w)) {
        wordKey = w;
        usedWords.add(w);
        break;
      }
    }
    if (!wordKey) wordKey = pick(tpl.words);
    
    const correctForm = getForm(wordKey, caseName);
    const usedForms = new Set([correctForm]);
    
    // Generate wrong forms from different words
    const wrongWords = tpl.words.filter(w => w !== wordKey).sort(() => Math.random() - 0.5);
    const wrongForms = [];
    for (let j = 0; j < wrongWords.length && wrongForms.length < 3; j++) {
      const wrongForm = getForm(wrongWords[j], caseName);
      if (!usedForms.has(wrongForm)) {
        wrongForms.push(wrongForm);
        usedForms.add(wrongForm);
      }
    }
    // Pad with other-case forms
    const otherCases = ['nom','gen','dat','acc','inst','loc','voc'].filter(c => c !== caseName);
    while (wrongForms.length < 3) {
      const otherCase = otherCases[wrongForms.length % otherCases.length];
      const w = pick(tpl.words);
      const f = getForm(w, otherCase);
      if (!usedForms.has(f)) {
        wrongForms.push(f);
        usedForms.add(f);
      }
    }
    
    // Build question text with blank
    const blankSentence = tpl.sentence.replace(new RegExp('\\{\\{word\\.\\w+\\}\\}', 'g'), '______');
    
    // Alternate: choice/fill 50/50
    if (i % 2 === 0) {
      const options = [correctForm, ...wrongForms.slice(0, 3)];
      const shuffled = options.sort(() => Math.random() - 0.5);
      const correctIdx = shuffled.indexOf(correctForm);
      questions.push({
        type: 'choice',
        question: `Uzupełnij: ${blankSentence}`,
        options: shuffled,
        correct: correctIdx,
        explanation: `${tpl.note}: ${correctForm}`,
      });
    } else {
      questions.push({
        type: 'fill',
        question: `Uzupełnij poprawną formą: ${blankSentence}`,
        polish: '',
        answer: correctForm,
        explanation: `${tpl.note}: ${correctForm}`,
      });
    }
  }
  
  return {
    title: templateGroup.title,
    questions: questions,
  };
}

function cramFlip() {
  state._cramFlipped = !state._cramFlipped;
  renderCram();
}

function cramHideWord() {
  var word = state._cramWords[state._cramIndex];
  if (!word) return;
  if (!state.hiddenFlashcardWords) state.hiddenFlashcardWords = [];
  state.hiddenFlashcardWords.push(word.pl);
  saveState();
  state._cramFlipped = false;
  state._cramIndex++;
  renderCram();
}

function cramAnswer(known) {
  var word = state._cramWords[state._cramIndex];
  if (!word) return;
  
  if (known) {
    state._cramKnown.push(word);
  } else {
    state._cramUnknown.push(word);
  }
  
  state._cramIndex++;
  state._cramFlipped = false;
  renderCram();
}

function finishCram() {
  var known = state._cramKnown ? state._cramKnown.length : 0;
  var total = (state._cramKnown ? state._cramKnown.length : 0) + (state._cramUnknown ? state._cramUnknown.length : 0);
  var pct = total > 0 ? Math.round(known / total * 100) : 0;
  
  state.phase = 'tree';
  state.xp += Math.round(known / 2);
  saveState();
  
  var wrap = document.getElementById('contentWrap');
  wrap.innerHTML = '<div class="exercise-card" style="text-align:center;">' +
    '<div style="font-size:48px;margin:12px 0;">' + (pct >= 80 ? '★' : pct >= 50 ? '✓' : '✦') + '</div>' +
    '<h3 style="font-size:20px;margin:8px 0;">' + known + '/' + total + ' (' + pct + '%)</h3>' +
    '<p style="color:var(--text-light);">' + (pct >= 80 ? 'Świetnie!' : pct >= 50 ? 'Dobra robota!' : 'Jeszcze trochę!') + '</p></div>';
  
  document.getElementById('progressStrip').innerHTML = '';
  document.getElementById('mainBtn').textContent = '← Powrót do kursu';
  document.getElementById('mainBtn').disabled = false;
  document.getElementById('mainBtn').className = 'check-btn secondary';
  document.getElementById('mainBtn').onclick = function() { render(); };
  renderTopBar();
  
  delete state._cramWords;
  delete state._cramIndex;
  delete state._cramFlipped;
  delete state._cramKnown;
  delete state._cramUnknown;
  delete state._cramCycle;
}

function startPersonalEdit() {
  state.phase = 'personal-edit';
  renderPersonalEdit();
}

// Safe storage wrapper — falls back to memory when localStorage is blocked (file:// on mobile)
const Storage = {
  _data: {},
  _available: (function(){ try { localStorage.setItem('_test','1'); localStorage.removeItem('_test'); return true; } catch(e){ return false; } })(),
  get(key) {
    if (!this._available) return this._data[key] || null;
    try { return localStorage.getItem(key); } catch(e) { return this._data[key] || null; }
  },
  set(key, val) {
    this._data[key] = val;
    if (this._available) { try { localStorage.setItem(key, val); } catch(e) {} }
  },
  remove(key) {
    delete this._data[key];
    if (this._available) { try { localStorage.removeItem(key); } catch(e) {} }
  }
};

function loadState() {
  try {
    const saved = Storage.get('polskiB1');
    if (saved) Object.assign(state, JSON.parse(saved));
  } catch(e) {}
  // Load theme
  const theme = Storage.get('polskiB1Theme');
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
  }
    unlockedSkills = null;
  // Load personal vocab from localStorage (overrides from file)
  if (typeof PERS_VOCAB !== 'undefined') {
    try {
      var savedPers = localStorage.getItem('polskiB1_pers');
      if (savedPers) {
        var parsed = JSON.parse(savedPers);
        if (Array.isArray(parsed) && parsed.length > 0) {
          PERS_VOCAB.length = 0;
          for (var pi = 0; pi < parsed.length; pi++) {
            PERS_VOCAB.push(parsed[pi]);
          }
        }
      }
    } catch(e) {}
  }
}

let unlockedSkills = null;
function getUnlockedSkills() {
  if (unlockedSkills) return unlockedSkills;
  // unlock logic: unit 1 all open, others need prev skill completed
  const unlocked = new Set();
  for (const s of SKILLS) {
    if (s.unit === 1) { unlocked.add(s.id); continue; }
    // Check if previous skill in same unit is completed, or if any skill in prev unit is completed
    const prevUnitSkills = SKILLS.filter(x => x.unit === s.unit - 1);
    const prevInUnit = SKILLS.filter(x => x.unit === s.unit && x.order < s.order);
    if (prevUnitSkills.some(x => state.completedSkills[x.id]) ||
        prevInUnit.some(x => state.completedSkills[x.id])) {
      unlocked.add(s.id);
    }
  }
  // First skill of any unit is unlocked if prev unit has any progress
  for (const s of SKILLS) {
    if (s.order === 1 && s.unit > 1) {
      const prevUnitSkills = SKILLS.filter(x => x.unit === s.unit - 1);
      const anyPrevUnitCompleted = prevUnitSkills.some(x => state.completedSkills[x.id]);
      if (anyPrevUnitCompleted) unlocked.add(s.id);
    }
  }
  // First unit always unlocked
  SKILLS.filter(s => s.unit === 1).forEach(s => unlocked.add(s.id));
  unlockedSkills = unlocked;
  return unlocked;
}

function startSkill(skillId) {
  const skill = SKILLS.find(s => s.id === skillId);
  if (!skill) return;
  state.currentSkillIndex = skillId;
  
  // Reset progress display
  state.currentQ = 0;
  state.correctInLesson = 0;

  if (skill.type === 'lesson') {
    state.phase = 'lesson';
    renderLessonUI();
  } else {
    state.phase = 'exercise';
    // Try dynamic generation first (case or adjective exercises)
    let ex = null;
    if (typeof CASE_TEMPLATES !== 'undefined' && CASE_TEMPLATES[skillId]) {
      ex = generateExercise(skillId);
    }
    if (!ex && typeof ADJ_TEMPLATES !== 'undefined' && ADJ_TEMPLATES[skillId]) {
      ex = generateAdjExercise(skillId);
    }
    if (!ex) {
      ex = EXERCISES[skillId];
    }
    if (!ex) { 
      state.phase = 'tree';
      render();
      return;
    }
    state.totalQuestions = ex.questions.length;
    state.progressDots = ex.questions.map(() => 'pending');
    window._currentExerciseData = ex;
    renderExercise();
  }
}

function renderLessonUI() {
  const skill = SKILLS.find(s => s.id === state.currentSkillIndex);
  if (!skill) { renderTree(); return; }

  const wrap = $('contentWrap');
  wrap.innerHTML = renderLessonContent(skill.id);

  $('progressStrip').innerHTML = '';
  $('mainBtn').textContent = '✓ Rozumiem, lecimy dalej';
  $('mainBtn').disabled = false;
  $('mainBtn').onclick = () => {
    if (state.phase !== 'lesson') { renderTree(); return; }
    // Mark lesson as complete + XP
    if (!state.completedSkills[skill.id]) {
      state.completedSkills[skill.id] = true;
      state.xp += 25;
      checkLevelUp();
      saveState();
    }
    // Find next skill in same unit
    const unitSkills = SKILLS.filter(s => s.unit === skill.unit).sort((a,b) => a.order - b.order);
    const idx = unitSkills.findIndex(s => s.id === skill.id);
    if (idx < unitSkills.length - 1) {
      startSkill(unitSkills[idx+1].id);
    } else {
      const allSkills = SKILLS.filter(s => s.unit >= skill.unit);
      const allIdx = allSkills.findIndex(s => s.id === skill.id);
      if (allIdx < allSkills.length - 1) {
        startSkill(allSkills[allIdx+1].id);
      } else {
        renderTree();
      }
    }
    renderTopBar();
  };
}

function renderLessonContent(skillId) {
  // Get the lesson HTML from the switch-based lesson renderer
  return getLessonHtml(skillId);
}

function getLessonHtml(lessonId) {
  // Call the HTML-generating renderLesson defined in the DATA section
  return renderLesson(lessonId);
}

function getExerciseData() {
  const skill = SKILLS.find(s => s.id === state.currentSkillIndex);
  if (!skill || !EXERCISES[skill.id]) return null;
  return { skill, exercise: EXERCISES[skill.id] };
}

// ========================================================================
// EXAM MODE — render a single question from the exam bank
// ========================================================================
function renderExamQuestion() {
  var qs = state._examQuestions;
  if (!qs || state.currentQ >= qs.length) { finishExam(); return; }
  var q = qs[state.currentQ];
  
  var dots = qs.map(function(_, i) {
    var cls = state.progressDots[i] === 'done' ? 'done' : state.progressDots[i] === 'wrong' ? 'wrong' : i === state.currentQ ? 'active' : '';
    return '<div class="progress-dot ' + cls + '">' + (i+1) + '</div>';
  });
  document.getElementById('progressStrip').innerHTML = dots.join('');
  
  var min = Math.floor(state._examTimeLeft / 60);
  var sec = state._examTimeLeft % 60;
  var timeStr = min + ':' + (sec < 10 ? '0' : '') + sec;
  
  var typeLabel = q.skillType || 'Egzamin';
  var html = '<div class="exercise-card"><div class="hint" style="display:flex;justify-content:space-between;">';
  html += '<span>◎ ' + typeLabel + ' &middot; ' + (state.currentQ+1) + '/' + qs.length + '</span>';
  html += '<span id="examTimer" style="color:var(--error);font-weight:700;">⏱ ' + timeStr + '</span></div>';
  html += '<div class="question">' + (q.question || '') + '</div>';
  if (q.polish) html += '<div class="polish-text">' + q.polish + '</div>';
  
  if (q.type === 'choice' && q.options) {
    html += '<div class="options">';
    var letters = ['a','b','c','d'];
    q.options.forEach(function(opt, i) {
      html += '<button class="option-btn" onclick="examSelect(' + i + ')" id="exam_opt_' + i + '"><span class="letter">' + letters[i] + '</span> ' + opt + '</button>';
    });
    html += '</div>';
    window._examSelected = null;
  } else if (q.type === 'fill') {
    html += '<div class="fill-input"><input type="text" id="examInput" placeholder="Wpisz odpowiedź..." autocomplete="off" style="width:100%;"></div>';
    setTimeout(function() {
      var inp = document.getElementById('examInput');
      if (inp) { inp.focus(); inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') examCheck(); }); }
    }, 100);
  }
  html += '</div>';
  document.getElementById('contentWrap').innerHTML = html;
  
  document.getElementById('mainBtn').textContent = 'Sprawdź ✓';
  document.getElementById('mainBtn').disabled = false;
  document.getElementById('mainBtn').className = 'check-btn';
  document.getElementById('mainBtn').onclick = examCheck;
}

function examSelect(idx) {
  window._examSelected = idx;
  document.querySelectorAll('.option-btn').forEach(function(el, i) {
    el.classList.toggle('selected', i === idx);
  });
}

function examCheck() {
  var qs = state._examQuestions;
  var q = qs[state.currentQ];
  var isCorrect = false;
  
  if (q.type === 'choice') {
    if (window._examSelected === null || window._examSelected === undefined) return;
    isCorrect = window._examSelected === q.correct;
    document.querySelectorAll('.option-btn').forEach(function(el, i) {
      if (i === q.correct) el.classList.add('correct');
      if (i === window._examSelected && !isCorrect) el.classList.add('wrong');
    });
  } else if (q.type === 'fill') {
    var inp = document.getElementById('examInput');
    if (!inp || !inp.value.trim()) return;
    isCorrect = inp.value.trim().toLowerCase() === (q.answer || '').toLowerCase();
    inp.classList.add(isCorrect ? 'correct' : 'wrong');
    inp.disabled = true;
  }
  
  if (isCorrect) {
    state.progressDots[state.currentQ] = 'done';
    state._examCorrect = (state._examCorrect || 0) + 1;
    state.correctInLesson = (state.correctInLesson || 0) + 1;
  } else {
    state.progressDots[state.currentQ] = 'wrong';
  }
  
  document.getElementById('mainBtn').disabled = true;
  
  if (state.currentQ < qs.length - 1) {
    document.getElementById('mainBtn').textContent = 'Dalej →';
    document.getElementById('mainBtn').disabled = false;
    document.getElementById('mainBtn').onclick = function() {
      state.currentQ++;
      renderExamQuestion();
    };
  } else {
    document.getElementById('mainBtn').textContent = 'Zakończ egzamin ▤';
    document.getElementById('mainBtn').disabled = false;
    document.getElementById('mainBtn').onclick = finishExam;
  }
}
function renderExercise() {
  // Exam mode: use stored questions instead of exercise data
  if (state._examQuestions) {
    renderExamQuestion();
    return;
  }
  const data = getExerciseData();
  if (!data) { renderTree(); return; }
  const { skill, exercise } = data;
  
  // Setup progress dots
  const dotsHtml = exercise.questions.map((q, i) => {
    const cls = state.progressDots[i] === 'done' ? 'done' : 
                state.progressDots[i] === 'wrong' ? 'wrong' :
                i === state.currentQ ? 'active' : '';
    return `<div class="progress-dot ${cls}">${i+1}</div>`;
  }).join('');
  $('progressStrip').innerHTML = dotsHtml;

  const q = exercise.questions[state.currentQ];
  if (!q) {
    finishExercise();
    return;
  }

  // Reset exercise state for this question
  exerciseState = { selected: null, inputs: {}, matches: {}, matchLeftSelected: null, showFeedback: false, answered: false };

  const wrap = $('contentWrap');
  let html = `<div class="exercise-card">
    <div class="hint">${exercise.title} &middot; Pytanie ${state.currentQ + 1} z ${exercise.questions.length}</div>
    <div class="question">${q.question}</div>`;

  if (q.polish) {
    html += `<div class="polish-text">${q.polish.replace(/\n/g, '<br>')}</div>`;
  }

  // Render by type
  if (q.type === 'choice' && q.options) {
    html += '<div class="options" id="optionsContainer">';
    const letters = ['a', 'b', 'c', 'd'];
    q.options.forEach((opt, i) => {
      html += `<button class="option-btn" onclick="selectOption(${i})" id="opt_${i}">
        <span class="letter">${letters[i]}</span> ${opt}
      </button>`;
    });
    html += '</div>';
  } else if (q.type === 'fill') {
    html += `<div class="fill-input">
      <input type="text" id="fillInput" placeholder="Wpisz odpowiedź..." autocomplete="off" autocapitalize="off">
    </div>`;
  } else if (q.type === 'taknie' && q.items) {
    html += '<div id="taknieContainer">';
    q.items.forEach((item, i) => {
      html += `<div style="margin-bottom:12px;padding:10px;background:var(--option-bg);border-radius:8px;border:1px solid var(--border);">
        <div style="font-size:14px;margin-bottom:6px;">${i+1}. ${item.text}</div>
        <div class="tak-nie">
          <button class="tak-btn" onclick="selectTakNie(${i}, true)" id="tn_${i}_tak">TAK</button>
          <button class="nie-btn" onclick="selectTakNie(${i}, false)" id="tn_${i}_nie">NIE</button>
        </div>
      </div>`;
    });
    html += '</div>';
  } else if (q.type === 'match' && q.pairs) {
    const shuffledLeft = [...q.pairs].sort(() => Math.random() - 0.5);
    const shuffledRight = [...q.pairs].sort(() => Math.random() - 0.5);
    html += `<div id="matchContainer">`;
    html += `<div style="display:flex;gap:12px;margin-bottom:8px;">
      <div style="flex:1;font-weight:700;font-size:13px;text-align:center;color:var(--accent);">Nagłówek</div>
      <div style="flex:1;font-weight:700;font-size:13px;text-align:center;color:var(--accent);">Treść</div>
    </div>`;
    shuffledLeft.forEach((pair, i) => {
      exerciseState.matches['l'+i] = { pair, matched: false };
      html += `<div class="match-pair" id="mp_${i}">
        <div class="match-left" onclick="selectMatchLeft(${i})" id="ml_${i}">${pair.left}</div>
        <div class="match-right" onclick="selectMatchRight(${i})" id="mr_${i}">${shuffledRight[i].right}</div>
      </div>`;
    });
    html += '</div>';
  } else if (q.type === 'writing') {
    html += `<textarea class="writing-area" id="writingArea" placeholder="Napisz tutaj..." ${q.hint ? '' : ''}></textarea>`;
    if (q.hint) {
      html += `<div style="font-size:13px;color:var(--text-light);margin-bottom:8px;">⚑ ${q.hint}</div>`;
    }
  }

  html += '</div>';
  wrap.innerHTML = html;

  // Bottom button
  $('mainBtn').textContent = 'Sprawdź ✓';
  $('mainBtn').disabled = false;
  $('mainBtn').onclick = checkAnswer;
  $('mainBtn').className = 'check-btn';

  if (q.type === 'fill') {
    setTimeout(() => {
      const inp = document.getElementById('fillInput');
      if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); }); }
    }, 100);
  }
}

function selectOption(idx) {
  if (exerciseState.answered) return;
  exerciseState.selected = idx;
  document.querySelectorAll('.option-btn').forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
}

function selectTakNie(qIdx, val) {
  if (exerciseState.answered) return;
  exerciseState.selected = exerciseState.selected || {};
  exerciseState.selected[qIdx] = val;
  const takBtn = document.getElementById(`tn_${qIdx}_tak`);
  const nieBtn = document.getElementById(`tn_${qIdx}_nie`);
  if (takBtn) takBtn.classList.toggle('selected', val === true);
  if (nieBtn) nieBtn.classList.toggle('selected', val === false);
}

function selectMatchLeft(idx) {
  if (exerciseState.answered) return;
  const el = document.getElementById(`ml_${idx}`);
  if (!el || el.classList.contains('matched')) return;
  exerciseState.matchLeftSelected = idx;
  document.querySelectorAll('.match-left').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}

function selectMatchRight(idx) {
  if (exerciseState.answered) return;
  const leftIdx = exerciseState.matchLeftSelected;
  if (leftIdx === null) return;
  if (document.getElementById(`ml_${leftIdx}`)?.classList.contains('matched')) return;
  
  // Check match: find pair data
  const data = getExerciseData();
  const q = data.exercise.questions[state.currentQ];
  const pairData = q.pairs;
  const leftText = document.getElementById(`ml_${leftIdx}`).textContent;
  const rightText = document.getElementById(`mr_${idx}`).textContent;
  
  const leftPair = pairData.find(p => p.left === leftText);
  const rightPair = pairData.find(p => p.right === rightText);
  
  if (leftPair && rightPair && leftPair.right === rightText) {
    // Correct match
    document.getElementById(`ml_${leftIdx}`).classList.remove('selected');
    document.getElementById(`ml_${leftIdx}`).classList.add('matched');
    document.getElementById(`mr_${idx}`).classList.add('matched');
    exerciseState.matches['m' + leftIdx + '_' + idx] = true;
  } else {
    // Wrong
    document.getElementById(`ml_${leftIdx}`).classList.add('wrong');
    document.getElementById(`mr_${idx}`).classList.add('wrong');
    setTimeout(() => {
      document.getElementById(`ml_${leftIdx}`)?.classList.remove('wrong', 'selected');
      document.getElementById(`mr_${idx}`)?.classList.remove('wrong');
    }, 400);
  }
  exerciseState.matchLeftSelected = null;
  
  // Check if all matched
  const allMatched = pairData.every(p => {
    const leftEl = [...document.querySelectorAll('.match-left')].find(el => el.textContent === p.left);
    return leftEl?.classList.contains('matched');
  });
  if (allMatched) {
    setTimeout(() => checkAnswer(), 300);
  }
}

function checkAnswer() {
  if (exerciseState.answered) return;
  
  const data = getExerciseData();
  if (!data) return;
  const { exercise } = data;
  const q = exercise.questions[state.currentQ];
  let isCorrect = false;
  let feedbackMsg = '';
  let expText = q.explanation || '';

  if (q.type === 'choice') {
    if (exerciseState.selected === null) return;
    isCorrect = exerciseState.selected === q.correct;
    document.querySelectorAll('.option-btn').forEach((el, i) => {
      if (i === q.correct) el.classList.add('correct');
      if (i === exerciseState.selected && !isCorrect) el.classList.add('wrong');
    });
    const letters = ['a', 'b', 'c', 'd'];
    feedbackMsg = isCorrect ? '✓ Dobrze!' : `✕ Nie. Prawidłowa odpowiedź: ${letters[q.correct]}) ${q.options[q.correct]}`;
  } else if (q.type === 'fill') {
    const inp = document.getElementById('fillInput');
    if (!inp) return;
    const val = inp.value.trim().toLowerCase();
    if (!val) return;
    const correct = q.answer.toLowerCase();
    const alts = (q.alt || []).map(a => a.toLowerCase());
    isCorrect = val === correct || alts.includes(val);
    inp.classList.add(isCorrect ? 'correct' : 'wrong');
    feedbackMsg = isCorrect ? '✓ Dobrze!' : `✕ Nie. Poprawna: ${q.answer}`;
  } else if (q.type === 'taknie') {
    if (!exerciseState.selected || Object.keys(exerciseState.selected).length < q.items.length) return;
    isCorrect = true;
    let wrongCount = 0;
    q.items.forEach((item, i) => {
      const userAns = exerciseState.selected[i];
      const correctBtn = document.getElementById(`tn_${i}_${item.correct ? 'tak' : 'nie'}`);
      if (correctBtn) correctBtn.classList.add('correct');
      if (userAns !== item.correct) {
        const wrongBtn = document.getElementById(`tn_${i}_${userAns ? 'tak' : 'nie'}`);
        if (wrongBtn) wrongBtn.classList.add('wrong');
        wrongCount++;
      }
    });
    isCorrect = wrongCount === 0;
    feedbackMsg = isCorrect ? '✓ Wszystkie poprawne!' : `✕ ${wrongCount} błędów.`;
  } else if (q.type === 'match') {
    const allMatched = [...document.querySelectorAll('.match-left')].every(el => el.classList.contains('matched'));
    isCorrect = allMatched;
    feedbackMsg = isCorrect ? '✓ Wszystkie dopasowane!' : '✕ Spróbuj dopasować wszystkie pary.';
  } else if (q.type === 'writing') {
    // Writing is always "correct" if they wrote something
    const area = document.getElementById('writingArea');
    if (!area || area.value.trim().length < 10) {
      feedbackMsg = '✏️ Napisz coś (minimum 10 znaków).';
      showTempFeedback(feedbackMsg);
      return;
    }
    isCorrect = true;
    feedbackMsg = '✏️ Dobrze! Porównaj ze wzorem poniżej:';
    expText = '';
    // Show sample answer
    const wrap = $('contentWrap');
    const sampleDiv = document.createElement('div');
    sampleDiv.className = 'sample-answer';
    sampleDiv.innerHTML = `<strong>✎ Wzór:</strong><br>${(q.sample || '').replace(/\n/g, '<br>')}`;
    wrap.appendChild(sampleDiv);
  }

  exerciseState.answered = true;
  $('mainBtn').disabled = true;

  if (isCorrect) {
    state.correctInLesson++;
    state.progressDots[state.currentQ] = 'done';
    state.xp += 10;
    // Track progress in skill
    const sid = state.currentSkillIndex;
    state.skillProgress[sid] = (state.skillProgress[sid] || 0) + (100 / state.totalQuestions);
  } else {
    state.progressDots[state.currentQ] = 'wrong';
    // Track error for review — if the current exercise has word data
    if (window._currentExerciseData) {
      const q = window._currentExerciseData.questions[state.currentQ];
      const errEntry = {
        skillId: state.currentSkillIndex,
        question: q.question,
        correctAnswer: q.type === 'choice' ? q.options[q.correct] : q.answer,
        context: q.explanation || '',
        timestamp: Date.now(),
      };
      // Deduplication — skip if already exists
      const alreadyExists = state.errorQueue.some(e => e.question === errEntry.question && e.correctAnswer === errEntry.correctAnswer);
      if (!alreadyExists) {
        state.errorQueue.push(errEntry);
      }
    }
  }
  saveState();
  renderTopBar();

  // Show feedback
  showTempFeedback(feedbackMsg + (expText ? `<br><span style="font-size:13px;color:var(--text-light)">⚑ ${expText}</span>` : ''));

  // Update button to next
  // In exam mode, override handler
  if (state._examQuestions) {
    $('mainBtn').textContent = 'Dalej →';
    $('mainBtn').disabled = false;
    $('mainBtn').onclick = function() {
      state.currentQ++;
      if (state.currentQ < state._examQuestions.length - 1) {
        state._examIndex = state.currentQ;
        renderExercise();
      } else {
        state._examIndex = state.currentQ;
        renderExercise();
        document.getElementById('mainBtn').textContent = 'Zakończ egzamin ▤';
        document.getElementById('mainBtn').onclick = finishExam;
      }
    };
  } else {
    $('mainBtn').textContent = state.currentQ < state.totalQuestions - 1 ? 'Dalej →' : 'Zakończ ▤';
    $('mainBtn').disabled = false;
    $('mainBtn').onclick = () => {
      if (state.currentQ < state.totalQuestions - 1) {
        state.currentQ++;
        renderExercise();
      } else {
        finishExercise();
      }
    };
  }
}

function showTempFeedback(msg) {
  // Remove old feedback
  const old = document.querySelector('.feedback');
  if (old) old.remove();
  
  const isCorrect = msg.includes('✓') || msg.includes('✏️ Dobrze');
  const fdiv = document.createElement('div');
  fdiv.className = 'feedback';
  fdiv.innerHTML = `<div class="icon">${isCorrect ? '★' : '✦'}</div>
    <div class="msg" style="color:${isCorrect ? 'var(--primary-dark)' : 'var(--red)'}">${msg}</div>
    <div class="sub">${isCorrect ? `+10 XP` : 'Spróbuj jeszcze raz!'}</div>`;
  const wrap = $('contentWrap');
  wrap.insertBefore(fdiv, wrap.firstChild);
  fdiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function finishExercise() {
  const sid = state.currentSkillIndex;
  const data = getExerciseData();
  const total = data?.exercise?.questions?.length || 0;
  const correct = state.correctInLesson;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;

  // If 60%+ correct, mark as completed
  if (pct >= 60) {
    state.completedSkills[sid] = true;
    const bonus = Math.round((pct / 100) * 30);
    state.xp += bonus;
    state.streak++;
    saveState();
    renderTopBar();
    showTempFeedback(`★ Świetnie! ${correct}/${total} poprawnych (${pct}%)<br>+${bonus} XP bonus! 🔥 Streak: ${state.streak}`);
    checkLevelUp();
  } else {
    saveState();
    renderTopBar();
    showTempFeedback(`✦ ${correct}/${total} poprawnych. Spróbuj ponownie!`);
  }

  $('progressStrip').innerHTML = '';
  $('mainBtn').textContent = '← Powrót do kursu';
  $('mainBtn').disabled = false;
  $('mainBtn').onclick = () => { 
    state.phase = 'tree'; 
    render(); 
  };
  $('mainBtn').className = 'check-btn secondary';
}

function checkLevelUp() {
  const levels = [0, 100, 250, 500, 800, 1200, 1800, 2500, 3500, 5000];
  for (let i = levels.length - 1; i >= 0; i--) {
    if (state.xp >= levels[i]) {
      if (i + 1 > state.level) {
        state.level = i + 1;
        $('levelTitle').textContent = `★ Level ${state.level}!`;
        $('levelMsg').textContent = `Zdobyłeś ${state.xp} XP! Świetna robota!`;
        $('levelModal').style.display = 'flex';
      }
      break;
    }
  }
}

function closeLevelModal() {
  $('levelModal').style.display = 'none';
}

// ========================================================================
// ADJECTIVE EXERCISE GENERATOR
// ========================================================================
function generateAdjExercise(skillId) {
  const templateGroup = ADJ_TEMPLATES[skillId];
  if (!templateGroup) return null;

  const questions = [];
  const available = [...templateGroup.templates];
  const targetCount = Math.min(available.length, 5);
  const usedWords = new Set();
  const usedAdjs = new Set();

  for (let i = 0; i < targetCount; i++) {
    const tpl = available.splice(Math.floor(Math.random() * available.length), 1)[0];
    if (!tpl) break;

    // Pick unused adjective
    let adjKey;
    const shuffledAdj = [...tpl.adjPool].sort(() => Math.random() - 0.5);
    for (const a of shuffledAdj) {
      if (!usedAdjs.has(a)) { adjKey = a; usedAdjs.add(a); break; }
    }
    if (!adjKey) adjKey = tpl.adjPool[Math.floor(Math.random() * tpl.adjPool.length)];

    // Pick unused noun
    let wordKey;
    const shuffledWords = [...tpl.words].sort(() => Math.random() - 0.5);
    for (const w of shuffledWords) {
      if (!usedWords.has(w)) { wordKey = w; usedWords.add(w); break; }
    }
    if (!wordKey) wordKey = tpl.words[Math.floor(Math.random() * tpl.words.length)];

    // Extract case and gender from template
    // Format: {{adj:gender:case}} {{word:case}}
    const match = tpl.sentence.match(/\{\{adj:(\w):(\w+)\}\}/);
    const gender = match ? match[1] : 'm';
    const caseName = match ? match[2] : 'nom';
    const wordCase = tpl.sentence.match(/\{\{word:(\w+)\}\}/);
    const wordCaseName = wordCase ? wordCase[1] : 'nom';

    const correctAdj = getAdjForm(adjKey, gender, caseName);
    const correctNoun = getForm(wordKey, wordCaseName);
    const correctForm = correctAdj + ' ' + correctNoun;

    // Generate wrong adjective forms (different gender or case)
    const wrongGenders = { m: 'f', f: 'n', n: 'm' };
    const wrongGender = wrongGenders[gender] || 'm';
    const wrongAdj1 = getAdjForm(adjKey, wrongGender, caseName);
    const wrongAdj2 = getAdjForm(adjKey, gender, 'nom');
    const wrongForms = [
      wrongAdj1 + ' ' + correctNoun,
      wrongAdj2 + ' ' + correctNoun,
    ];
    const uniqueWrong = [...new Set(wrongForms.filter(f => f !== correctForm))];
    while (uniqueWrong.length < 3) {
      const wg = ['m','f','n'][Math.floor(Math.random()*3)];
      const wc = ['nom','gen','dat','acc','inst','loc'][Math.floor(Math.random()*6)];
      const f = getAdjForm(adjKey, wg, wc) + ' ' + correctNoun;
      if (f !== correctForm && !uniqueWrong.includes(f)) uniqueWrong.push(f);
    }

    const blankSentence = tpl.sentence.replace(/\{\{adj:\w:\w+\}\}/g, '______').replace(/\{\{word:\w+\}\}/g, '______');

    if (i % 2 === 0) {
      const options = [correctForm, ...uniqueWrong.slice(0, 3)];
      const shuffled = options.sort(() => Math.random() - 0.5);
      questions.push({
        type: 'choice',
        question: 'Uzupełnij: ' + blankSentence,
        options: shuffled,
        correct: shuffled.indexOf(correctForm),
        explanation: adjKey + ' (' + gender + ', ' + caseName + '): ' + correctForm,
      });
    } else {
      questions.push({
        type: 'fill',
        question: 'Uzupełnij poprawną formą: ' + blankSentence,
        polish: '',
        answer: correctForm,
        explanation: adjKey + ' (' + gender + ', ' + caseName + '): ' + correctForm,
      });
    }
  }

  return { title: templateGroup.title, questions: questions };
}


// ========================================================================
// PREPOSITIONS + CASES — which preposition goes with which case
// ========================================================================
function generateExam() {
  const questions = [];
  
  // Grammar questions (from dynamic generators)
  const cases = ['gen','dat','acc','inst','loc'];
  for (const c of cases) {
    const ex = generateExercise(c);
    if (ex && ex.questions.length > 0) {
      const q = ex.questions[Math.floor(Math.random() * ex.questions.length)];
      q.skillType = 'Gramatyka';
      questions.push(q);
    }
  }
  
  // Adjective question
  const adjEx = generateAdjExercise('ex-adj');
  if (adjEx && adjEx.questions.length > 0) {
    let q = adjEx.questions[Math.floor(Math.random() * adjEx.questions.length)];
    q.skillType = 'Przymiotniki';
    questions.push(q);
  }
  
  // Preposition question
  const prepEx = generatePrepExercise();
  if (prepEx && prepEx.questions.length > 0) {
    let q = prepEx.questions[Math.floor(Math.random() * prepEx.questions.length)];
    q.skillType = 'Przyimki';
    questions.push(q);
  }
  
  // Dialogues
  const dialogSkills = ['ex-dialogues-1','ex-dialogues-2','ex-dialogues-3'];
  for (const ds of dialogSkills) {
    const ex = EXERCISES[ds];
    if (ex && ex.questions.length > 0) {
      const q = { ...ex.questions[Math.floor(Math.random() * ex.questions.length)] };
      q.skillType = 'Dialogi';
      questions.push(q);
    }
  }
  
  // Reading
  const readSkills = ['exam-read-1','exam-listening'];
  for (const rs of readSkills) {
    const ex = EXERCISES[rs];
    if (ex && ex.questions.length > 0) {
      const q = { ...ex.questions[Math.floor(Math.random() * ex.questions.length)] };
      q.skillType = 'Czytanie';
      questions.push(q);
    }
  }
  
  // Shuffle and trim to 10
  const shuffled = questions.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 10);
}

function startExam() {
  const examQs = generateExam();
  if (examQs.length === 0) { showTempFeedback('Brak pytań. Najpierw odblokuj lekcje.'); return; }
  
  state._examQuestions = examQs;
  state._examIndex = 0;
  state._examCorrect = 0;
  state._examTimeLeft = 900; // 15 minutes in seconds
  state.phase = 'exercise';
  state.currentQ = 0;
  state.totalQuestions = examQs.length;
  state.progressDots = examQs.map(() => 'pending');
  state.correctInLesson = 0;
  
  // Render the first question BEFORE starting the timer
  state.phase = 'exercise';
  renderExamQuestion();
  
  // Start timer
  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(function() {
    state._examTimeLeft--;
    var min = Math.floor(state._examTimeLeft / 60);
    var sec = state._examTimeLeft % 60;
    var timeStr = min + ':' + (sec < 10 ? '0' : '') + sec;
    var timerEl = document.getElementById('examTimer');
    if (timerEl) timerEl.textContent = '⏱ ' + timeStr;
    if (state._examTimeLeft <= 0) {
      clearInterval(examTimer);
      finishExam();
    }
  }, 1000);
  
  // proceedNext() was here — now handled by renderExamQuestion
}

function proceedNext() {
  if (state._examIndex >= state._examQuestions.length - 1) {
    document.getElementById('mainBtn').textContent = 'Zakończ egzamin ▤';
    document.getElementById('mainBtn').disabled = false;
    document.getElementById('mainBtn').onclick = finishExam;
  }
}

function finishExam() {
  if (examTimer) clearInterval(examTimer);
  if (!state._examQuestions) { render(); return; }
  var correct = state._examCorrect || 0;
  var total = state._examQuestions ? state._examQuestions.length : 0;
  var pct = total > 0 ? Math.round(correct / total * 100) : 0;
  var passed = pct >= 60;
  
  state.phase = 'tree';
  state.xp += passed ? 50 : 10;
  saveState();
  
  var wrap = document.getElementById('contentWrap');
  wrap.innerHTML = '<div class="exercise-card" style="text-align:center;">' +
    '<div style="font-size:48px;margin:12px 0;">' + (passed ? '★' : '✦') + '</div>' +
    '<h3 style="font-size:22px;margin:8px 0;">' + (passed ? 'Zdałeś!' : 'Spróbuj jeszcze raz') + '</h3>' +
    '<p style="font-size:18px;font-weight:700;color:var(--text-dark);">' + correct + '/' + total + ' (' + pct + '%)</p>' +
    (passed ? '<p style="color:var(--text-light);">+50 XP</p>' : '<p style="color:var(--text-light);">+10 XP za wysiłek</p>') +
    '<p style="color:var(--text-light);margin-top:8px;font-size:14px;">' +
    (pct < 40 ? 'Skoncentruj się na gramatyce.' : pct < 60 ? 'Jeszcze trochę praktyki!' : 'Jesteś gotowy na prawdziwy egzamin!') +
    '</p></div>';
  
  document.getElementById('progressStrip').innerHTML = '';
  document.getElementById('mainBtn').textContent = '← Powrót do kursu';
  document.getElementById('mainBtn').disabled = false;
  document.getElementById('mainBtn').className = 'check-btn secondary';
  document.getElementById('mainBtn').onclick = function() { render(); };
  renderTopBar();
  delete state._examQuestions;
  delete state._examIndex;
  delete state._examCorrect;
  delete state._examTimeLeft;
}

// Override checkAnswer temporarily to handle exam mode
var _origCheckAnswer = null;
// ========================================================================
// REVIEW MODE — Retry wrong answers
// ========================================================================
function startReview() {
  if (state.errorQueue.length === 0) {
    showTempFeedback('★ Brak błędów do powtórki!');
    return;
  }
  state.phase = 'review';
  state.currentQ = 0;
  state.totalQuestions = state.errorQueue.length;
  state.progressDots = state.errorQueue.map(() => 'pending');
  state.correctInLesson = 0;
  renderReview();
}

function renderReview() {
  const items = state.errorQueue;
  if (state.currentQ >= items.length) {
    finishReview();
    return;
  }
  const item = items[state.currentQ];
  
  // Build progress dots
  const dots = items.map((_, i) => {
    const cls = state.progressDots[i] === 'done' ? 'done' : state.progressDots[i] === 'wrong' ? 'wrong' : i === state.currentQ ? 'active' : '';
    return '<div class="progress-dot ' + cls + '">' + (i+1) + '</div>';
  });
  document.getElementById('progressStrip').innerHTML = dots.join('');
  
  const wrap = document.getElementById('contentWrap');
  wrap.innerHTML = '<div class="exercise-card"><div class="hint">♺ Powtórka błędów &middot; ' + (state.currentQ+1) + ' z ' + items.length + '</div>' +
    '<div class="question">' + item.question + '</div>' +
    '<div class="polish-text" style="font-size:13px;">⚑ ' + item.context + '</div>' +
    '<div class="fill-input"><input type="text" id="reviewInput" placeholder="Wpisz poprawną formę..." autocomplete="off" style="width:100%;"></div></div>';
  
  document.getElementById('mainBtn').textContent = 'Sprawdź ✓';
  document.getElementById('mainBtn').disabled = false;
  document.getElementById('mainBtn').className = 'check-btn';
  document.getElementById('mainBtn').onclick = checkReviewAnswer;
  
  setTimeout(function() {
    var inp = document.getElementById('reviewInput');
    if (inp) { inp.focus(); inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') checkReviewAnswer(); }); }
  }, 100);
}

function checkReviewAnswer() {
  var inp = document.getElementById('reviewInput');
  if (!inp) return;
  var val = inp.value.trim().toLowerCase();
  if (!val) return;
  
  var item = state.errorQueue[state.currentQ];
  var correct = item.correctAnswer.toLowerCase();
  var isCorrect = val === correct;
  
  var key = state.currentQ;
  if (isCorrect) {
    state.progressDots[state.currentQ] = 'done';
    state.correctInLesson++;
    state.xp += 15;
    state.reviewCorrectCount[key] = (state.reviewCorrectCount[key] || 0) + 1;
    // Remove from queue after 3 consecutive correct
    if (state.reviewCorrectCount[key] >= 3) {
      state.errorQueue.splice(state.currentQ, 1);
      state.currentQ--;
    }
  } else {
    state.progressDots[state.currentQ] = 'wrong';
    state.reviewCorrectCount[key] = 0;
  }
  
  inp.classList.add(isCorrect ? 'correct' : 'wrong');
  inp.disabled = true;
  saveState();
  renderTopBar();
  
  showTempFeedback(isCorrect ? '✓ Dobrze!' : '✕ Poprawna: ' + item.correctAnswer);
  
  document.getElementById('mainBtn').textContent = state.currentQ < state.totalQuestions - 1 ? 'Dalej →' : 'Zakończ';
  document.getElementById('mainBtn').disabled = false;
  document.getElementById('mainBtn').onclick = function() {
    state.currentQ++;
    if (state.currentQ >= state.errorQueue.length || state.currentQ >= state.totalQuestions) {
      finishReview();
    } else {
      renderReview();
    }
  };
}

function finishReview() {
  var correct = state.correctInLesson;
  var total = state.totalQuestions;
  state.phase = 'tree';
  saveState();
  document.getElementById('progressStrip').innerHTML = '';
  showTempFeedback('♺ Powtórka zakończona! ' + correct + '/' + total + ' ✓');
  document.getElementById('mainBtn').textContent = '← Powrót do kursu';
  document.getElementById('mainBtn').disabled = false;
  document.getElementById('mainBtn').className = 'check-btn secondary';
  document.getElementById('mainBtn').onclick = function() { render(); };
  renderTopBar();
}

// ========================================================================
// FLASHCARD MODE — Browse words from word bank
// ========================================================================
function startFlashcard() {
  state.phase = 'flashcard';
  state.currentQ = 0;
  renderFlashcard();
}


function restoreHiddenFlashcard() {
  if (!state.hiddenFlashcardWords || state.hiddenFlashcardWords.length === 0) return;
  state.hiddenFlashcardWords = [];
  saveState();
  render();
}
function renderFlashcard() {
  var hidden = new Set(state.hiddenFlashcardWords || []);
  var visible = [];
  
  if (typeof PERS_VOCAB !== 'undefined') {
    for (var pi = 0; pi < PERS_VOCAB.length; pi++) {
      var w = PERS_VOCAB[pi].pl;
      if (!hidden.has(w)) visible.push({pl: w, ru: PERS_VOCAB[pi].ru, src: 'pers'});
    }
  }
  if (typeof VOCAB_LIST !== 'undefined') {
    var existing = new Set(visible.map(function(v) { return v.pl; }));
    for (var vi = 0; vi < VOCAB_LIST.length; vi++) {
      var w = VOCAB_LIST[vi].pl;
      if (!hidden.has(w) && !existing.has(w)) visible.push({pl: w, ru: VOCAB_LIST[vi].ru || '', src: 'voc'});
    }

  // Shuffle: use cached order to avoid re-shuffling on every render
  if (state.fcShuffle) {
    if (!state._fcVisible || state._fcVisible.length !== visible.length) {
      state._fcVisible = visible.slice();
      state._fcVisible.sort(function() { return Math.random() - 0.5; });
      if (state.currentQ >= state._fcVisible.length) state.currentQ = 0;
    }
    visible = state._fcVisible;
  } else {
    state._fcVisible = null;

    document.getElementById('contentWrap').innerHTML = '<div class="exercise-card" style="text-align:center;"><div class="hint">🃏 Fiszki</div><div style="font-size:48px;margin:12px 0;">✓</div><div style="font-size:18px;font-weight:600;">Wszystkie słowa ukryte!</div></div>';

    document.getElementById('mainBtn').textContent = '← Powrót';
    document.getElementById('mainBtn').disabled = false;
    document.getElementById('mainBtn').className = 'check-btn secondary';
    document.getElementById('mainBtn').onclick = function() { render(); };

    '<span onclick="toggleFcDirection()" style="cursor:pointer;display:inline-block;width:24px;height:24px;border-radius:4px;border:1px solid var(--border-soft);vertical-align:middle;' + (dir === 'pl2ru' ? 'background:linear-gradient(180deg,#fff 50%,#dc143c 50%);' : 'background:linear-gradient(180deg,#fff 33.3%,#0039a6 33.3%,#0039a6 66.6%,#d52b1e 66.6%);') + '"></span></span></div>';
  
  // Always show clickable word
  html += '<div onclick="flashcardFlip()" style="font-size:28px;font-weight:700;color:var(--text-dark);margin:16px 0;padding:20px 10px;cursor:pointer;border:2px dashed var(--border);border-radius:var(--radius);transition:0.2s;">' + front + '</div>';

  if (flipped) {
    // Translation drops below
    if (back) {
      html += '<div style="font-size:18px;color:var(--text);margin:8px 0 16px;padding:12px;background:var(--option-bg);border-radius:var(--radius-sm);word-break:break-word;">' + back + '</div>';
    } else {
      // Try WORD_BANK declension
      var wb = typeof WORD_BANK !== 'undefined' ? WORD_BANK[entry.pl] : null;
      if (wb) {
        html += '<table style="width:100%;border-collapse:collapse;font-size:12px;margin:8px 0 16px;"><tr><th style="padding:3px 6px;background:var(--th-bg);border:1px solid var(--border);">Przypadek</th><th style="padding:3px 6px;background:var(--th-bg);border:1px solid var(--border);">Forma</th></tr>' +
          '<tr><td style="padding:3px 6px;border:1px solid var(--border);font-weight:700;">M.</td><td style="padding:3px 6px;border:1px solid var(--border);text-align:center;">' + wb.nom + '</td></tr>' +
          '<tr><td style="padding:3px 6px;border:1px solid var(--border);font-weight:700;">D.</td><td style="padding:3px 6px;border:1px solid var(--border);text-align:center;">' + wb.gen + '</td></tr>' +
          '</table>';
      } else {
        html += '<div style="font-size:13px;color:var(--text-light);margin:8px 0 16px;">—</div>';

    '<button onclick="flashcardNext()" style="flex:2;padding:14px;background:var(--accent);border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;color:#fff;cursor:pointer;">Nast\u0119pne \u2192</button></div>';

function toggleFcDirection() {
  state.fcFlipDirection = (state.fcFlipDirection === 'pl2ru') ? 'ru2pl' : 'pl2ru';
  state._fcFlipped = false;
  saveState();
  renderFlashcard();
}

function toggleFcShuffle() {
  state.fcShuffle = !state.fcShuffle;
  state.currentQ = 0;
  state._fcFlipped = false;
  state._fcVisible = null;
  saveState();
  render();
}

function flashcardFlip() {
  state._fcFlipped = !state._fcFlipped;
  renderFlashcard();
}

function flashcardNext() {
  state._fcFlipped = false;
  state.currentQ++;
  renderFlashcard();
}

function hideFlashcardWord() {
  var hidden = new Set(state.hiddenFlashcardWords || []);
  var visible = [];
  if (typeof PERS_VOCAB !== 'undefined') {
    for (var pi = 0; pi < PERS_VOCAB.length; pi++) {
      var w = PERS_VOCAB[pi].pl;
      if (!hidden.has(w)) visible.push(w);
    }
  }
  if (typeof VOCAB_LIST !== 'undefined') {
    var existing = new Set(visible);
    for (var vi = 0; vi < VOCAB_LIST.length; vi++) {
      if (!hidden.has(VOCAB_LIST[vi].pl) && !existing.has(VOCAB_LIST[vi].pl)) visible.push(VOCAB_LIST[vi].pl);
    }
  }
  var word = visible[state.currentQ];
  if (!word) { flashcardNext(); return; }
  if (!state.hiddenFlashcardWords) state.hiddenFlashcardWords = [];
  state.hiddenFlashcardWords.push(word);
  saveState();
  flashcardNext();
}

function handleMainAction() {
  // Default fallback
  renderTree();
}

// ========================================================================
// HIDDEN WORDS
// ========================================================================

function startHiddenWords() {
  state.phase = 'hidden-words';
  document.getElementById('bottomWrap').style.display = '';
  render();
}

function renderHiddenWords() {
  state.phase = 'hidden-words';
  var hidden = state.hiddenFlashcardWords || [];
  var wrap = document.getElementById('contentWrap');
  
  var html = '<div class="exercise-card" style="text-align:center;">';
  html += '<div class="hint">⇧ Ukryte słowa</div>';
  
  if (hidden.length === 0) {
    html += '<div style="font-size:48px;margin:16px 0;">✓</div>';
    html += '<div style="font-size:18px;font-weight:600;margin-bottom:8px;">Brak ukrytych słów</div>';
    html += '<div style="font-size:14px;color:var(--text-light);margin-bottom:20px;">Wszystkie słowa są widoczne w Fiszkach.</div>';
    html += '</div>';
    wrap.innerHTML = html;
    document.getElementById('progressStrip').innerHTML = '';
    document.getElementById('mainBtn').textContent = '';
    document.getElementById('mainBtn').disabled = true;
    return;
  }
  
  html += '<div style="font-size:14px;color:var(--text-light);margin:8px 0 12px;">' + hidden.length + ' słów ukrytych przed Fiszkami</div>';
  
  // Przywróć wszystkie button
  html += '<button onclick="restoreHiddenFlashcard()" class="check-btn" style="width:100%;padding:14px;margin-bottom:16px;background:var(--gold, #d4a017);border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;color:#fff;cursor:pointer;">Przywróć wszystkie (' + hidden.length + ')</button>';
  
  // Build lookup maps for translations
  var persMap = {};
  var vocMap = {};
  if (typeof PERS_VOCAB !== 'undefined') {
    for (var pi = 0; pi < PERS_VOCAB.length; pi++) {
      persMap[PERS_VOCAB[pi].pl] = PERS_VOCAB[pi].ru;
    }
  }
  if (typeof VOCAB_LIST !== 'undefined') {
    for (var vi = 0; vi < VOCAB_LIST.length; vi++) {
      vocMap[VOCAB_LIST[vi].pl] = VOCAB_LIST[vi].ru || '';
    }
  }
  
  // List each hidden word with restore button
  for (var hi = 0; hi < hidden.length; hi++) {
    var w = hidden[hi];
    var ru = persMap[w] || vocMap[w] || '';
    html += '<div style="display:flex;align-items:center;padding:8px 10px;margin-bottom:4px;background:var(--card);border-radius:var(--radius-sm);border-left:3px solid var(--gold, #d4a017);">';
    html += '<div style="flex:1;text-align:left;">';
    html += '<span style="font-weight:600;font-size:15px;">' + w + '</span>';
    if (ru) html += ' <span style="font-size:13px;color:var(--text-light);">— ' + ru + '</span>';
    html += '</div>';
    html += '<button onclick="unhideWord(\'' + w.replace(/'/g, "\\'") + '\')" style="background:none;border:2px solid var(--accent);border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;padding:6px 12px;white-space:nowrap;">przywróć</button>';
    html += '</div>';
  }
  
  html += '</div>';
  
  wrap.innerHTML = html;
  document.getElementById('progressStrip').innerHTML = '';
  document.getElementById('mainBtn').textContent = '';
  document.getElementById('mainBtn').disabled = true;
}

function unhideWord(wordStr) {
  if (!state.hiddenFlashcardWords) return;
  var idx = state.hiddenFlashcardWords.indexOf(wordStr);
  if (idx === -1) return;
  state.hiddenFlashcardWords.splice(idx, 1);
  saveState();
  renderHiddenWords();
}

loadState();
render();
